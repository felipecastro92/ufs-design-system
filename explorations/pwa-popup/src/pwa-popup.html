<!-- ================================================================
     PWA POPUP — iPhone Safari "Add to Home Screen" prompt (bottom sheet)
     Figma "Rosana 2.0" 4880:4807 (panel) · 4863:4680 (position on screen)
     Hidden until pwaPopup.init() decides to show it (see pwa-popup.js).
================================================================ -->
<div class="ufs-pwa-popup" id="pwa-popup" hidden>
  <div class="ufs-pwa-popup__backdrop" data-pwa-close></div>
  <section class="ufs-pwa-popup__sheet" role="dialog" aria-modal="true" aria-labelledby="pwa-popup-title" aria-describedby="pwa-popup-desc" tabindex="-1">
    <button type="button" class="ufs-pwa-popup__close" aria-label="Close" data-pwa-close>
      <img src="../images/pwa-popup/pwa-close.svg" width="37" height="37" alt="" />
    </button>
    <h2 class="ufs-pwa-popup__title" id="pwa-popup-title">Download your personal hub</h2>
    <p class="ufs-pwa-popup__desc" id="pwa-popup-desc">Install for offline browsing, push notifications, and a native app feel—no App Store needed</p>
    <ul class="ufs-pwa-popup__benefits">
      <li><strong>Instant access:</strong> One-click launch without typing URLs or searching bookmarks</li>
      <li><strong>Faster navigation:</strong> Access content and features even without an internet connection.</li>
    </ul>
    <figure class="ufs-pwa-popup__media">
      <picture>
        <!-- Reduced motion: a still frame of the GIF instead of the animation -->
        <source srcset="../images/pwa-popup/pwa-media-placeholder.png" media="(prefers-reduced-motion: reduce)" />
        <img class="ufs-pwa-popup__media-img" src="../images/pwa-popup/pwa-media-placeholder.png" width="392" height="245" alt="How to install: tap the ⋯ button in Safari's toolbar, then Add to Home Screen" decoding="async" />
      </picture>
      <!-- Points at Safari's ⋯ button below the page (where Add to Home Screen is) -->
      <img class="ufs-pwa-popup__pointer" src="../images/pwa-popup/pwa-pointer.svg" width="21.9008" height="11.4039" alt="" />
    </figure>
  </section>
</div>
