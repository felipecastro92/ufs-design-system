  <!-- FOOD COST CALCULATOR PANEL (v3) — redesign of Figma 4764:4566 on the
       .signin-panel shell. Fixed header + footer (totals), scrolling body. -->
  <div class="signin-backdrop" id="fcc-backdrop" onclick="closeFcc()"></div>
  <div class="signin-panel ufs-fcc" id="fcc-panel" role="dialog" aria-modal="true" aria-labelledby="fcc-title" aria-hidden="true" inert>
    <div class="ufs-fcc__hd">
      <div class="ufs-fcc__hd-text">
        <h2 class="ufs-fcc__title" id="fcc-title" tabindex="-1">Food cost calculator</h2>
        <p class="ufs-fcc__sub">
          <span class="ufs-fcc__recipe" id="fcc-recipe"></span>
        </p>
      </div>
      <button type="button" class="signin-close" onclick="closeFcc()" aria-label="Close food cost calculator">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>
      </button>
    </div>

    <div class="ufs-fcc__body" id="fcc-body">
      <div class="ufs-fcc__setup">
        <div class="ufs-fcc__field">
          <span class="ufs-fcc__label" id="fcc-serv-label">Servings</span>
          <div class="fi-qty ufs-fcc__qty" role="group" aria-labelledby="fcc-serv-label">
            <button type="button" class="fi-qty-btn" id="fcc-serv-dec" aria-label="Decrease servings" onclick="stepServings(-1)">
              <svg viewBox="0 0 45 45" aria-hidden="true"><path d="M33.75 20.7a2.55 2.55 0 010 5.1h-22.5a2.55 2.55 0 010-5.1z"/></svg>
            </button>
            <span class="fi-qty-pill"><span class="fi-qty-value" id="fcc-serv" aria-live="polite">10</span></span>
            <button type="button" class="fi-qty-btn" aria-label="Increase servings" onclick="stepServings(1)">
              <svg viewBox="0 0 45 45" aria-hidden="true"><path d="M22.5 9.45a2.55 2.55 0 012.55 2.55v8.7h8.7a2.55 2.55 0 010 5.1h-8.7v8.7a2.55 2.55 0 01-5.1 0v-8.7h-8.7a2.55 2.55 0 010-5.1h8.7V12a2.55 2.55 0 012.55-2.55z"/></svg>
            </button>
          </div>
        </div>
        <label class="ufs-fcc__field" for="fcc-menu">
          <span class="ufs-fcc__label">Menu price per serving</span>
          <span class="ufs-fcc__money">
            <input class="fi-field ufs-fcc__input ufs-fcc__input--menu" id="fcc-menu" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-describedby="fcc-menu-unit" />
            <span class="ufs-fcc__unit" id="fcc-menu-unit">€ excl. VAT</span>
          </span>
        </label>
      </div>

      <div class="ufs-fcc__list-hd">
        <h3 class="ufs-fcc__h">Ingredients</h3>
        <span class="ufs-fcc__hint" id="fcc-priced"></span>
      </div>
      <ul class="ufs-fcc__list" id="fcc-list"></ul>

      <button type="button" class="btn btn-secondary btn-sm btn-icon-left ufs-fcc__add-toggle" id="fcc-add-toggle" aria-expanded="false" aria-controls="fcc-add" onclick="fccShowAdd(true)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        Add an ingredient
      </button>
      <form class="ufs-fcc__add" id="fcc-add" hidden onsubmit="fccAdd(event)" aria-label="Add an ingredient">
        <input class="fi-field ufs-fcc__name-input" id="fcc-add-name" type="text" placeholder="Ingredient name" aria-label="Ingredient name" autocomplete="off" required />
        <div class="ufs-fcc__add-row">
          <input class="fi-field ufs-fcc__input" id="fcc-add-qty" type="text" inputmode="decimal" placeholder="Quantity" aria-label="Quantity for the current servings" autocomplete="off" required />
          <select class="fi-field fi-select" id="fcc-add-unit" aria-label="Unit" onchange="fccAddUnit()">
            <option value="g">g</option><option value="ml">ml</option><option value="pc">pc</option>
          </select>
          <span class="ufs-fcc__money">
            <input class="fi-field ufs-fcc__input" id="fcc-add-price" type="text" inputmode="decimal" placeholder="Price" aria-label="Price" aria-describedby="fcc-add-price-unit" autocomplete="off" />
            <span class="ufs-fcc__unit" id="fcc-add-price-unit">€/kg</span>
          </span>
        </div>
        <div class="ufs-fcc__add-actions">
          <button type="button" class="btn btn-ghost btn-sm" onclick="fccShowAdd(false)">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Add</button>
        </div>
      </form>

      <p class="ufs-fcc__disclaimer">Prices for UFS products are indicative, based on wholesaler prices, and may change with the season or supply. UFS can't be held responsible for any deviations.</p>
      <div class="ufs-fcc__actions">
        <button type="button" class="ufs-fcc__reset" onclick="fccReset()">Reset calculation</button>
        <button type="button" class="btn btn-secondary btn-sm btn-icon-left" id="fcc-pdf" onclick="fccPdf(this)">
          <svg width="20" height="20" viewBox="0 0 45 45" fill="currentColor" aria-hidden="true"><path d="M9.1 35.1c.73.73 1.62 1.1 2.65 1.1h22.5c1.03 0 1.91-.37 2.65-1.1.73-.73 1.1-1.62 1.1-2.65v-3.75a1.875 1.875 0 00-3.75 0v3.75h-22.5v-3.75a1.875 1.875 0 00-3.75 0v3.75c0 1.03.37 1.92 1.1 2.65z"/><path d="M24.34 7.54A1.8 1.8 0 0023 7c-.53 0-.98.18-1.34.54-.36.36-.54.8-.54 1.34v13.4l-3.51-3.51a1.84 1.84 0 00-2.67.05 1.8 1.8 0 00-.54 1.29c-.02.52.16.96.54 1.34l6.75 6.75c.19.19.39.32.61.4.22.08.45.12.7.12s.48-.04.7-.12c.22-.08.42-.21.61-.4l6.75-6.75c.34-.34.52-.77.54-1.29a1.8 1.8 0 00-.54-1.34 1.84 1.84 0 00-1.36-.61c-.5 0-.94.19-1.31.56l-3.52 3.52V8.88c0-.53-.18-.98-.54-1.34z"/></svg>
          Save as PDF
        </button>
      </div>
      <p class="ufs-fcc__pdf-error" id="fcc-pdf-error" role="status"></p>
    </div>

    <div class="ufs-fcc__ft">
      <dl class="ufs-fcc__totals">
        <div><dt>Total cost</dt><dd id="fcc-total">0,00 €</dd></div>
        <div><dt>Per serving</dt><dd id="fcc-per">0,00 €</dd></div>
        <div><dt>Food cost</dt><dd><span id="fcc-pct">–</span><span class="ufs-fcc__status" id="fcc-status" hidden></span></dd></div>
      </dl>
      <p class="ufs-fcc__ft-note" id="fcc-note" hidden></p>
    </div>
  </div>
